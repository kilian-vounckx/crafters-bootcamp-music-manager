on: push
jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: 806880856788.dkr.ecr.eu-north-1.amazonaws.com/kunlabora/music-manager:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster music-man-cluster \
            --service music-man-task2-service-ul7lupge \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for ECS deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster music-man-cluster \
            --services music-man-task2-service-ul7lupge \
            --region ${{ secrets.AWS_REGION }}
          echo "✅ New tasks are running, old tasks are stopped"

      - name: Verify health endpoint
        run: |
          URL="music-man-alb-1700087534.eu-north-1.elb.amazonaws.com"
          MAX_ATTEMPTS=10
          INTERVAL=5
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Got HTTP $STATUS, retrying in ${INTERVAL}s..."
            sleep $INTERVAL
          done
          
          echo "❌ Health check failed after stabilization"
          exit 1